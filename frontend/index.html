<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A1A12" />
    <meta
      name="description"
      content="BeviGrow Trade Tracker — export and import enquiries, quotes and follow-ups."
    />
    <title>BeviGrow · Trade Tracker</title>
    <link rel="icon" href="/bean.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts load without blocking the first paint.

      A plain <link rel="stylesheet"> to Google Fonts holds up rendering until
      two cross-origin round trips finish (googleapis for the CSS, then
      gstatic for the files). That is the only third-party request in the
      critical path, and it is the one an iPhone is most likely to be slow at:
      iCloud Private Relay proxies Safari's connections, so those two hops pay
      the proxy cost while same-origin assets are already cached at the edge.

      `media="print"` makes the browser fetch it at low priority without
      waiting for it; onload promotes it to the real stylesheet. `display=swap`
      already renders text in the fallback face immediately, so the only
      visible effect is the heading font arriving a moment later.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
