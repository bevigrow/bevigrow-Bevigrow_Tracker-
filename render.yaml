# Render blueprint for the BeviGrow Coffee B2B Tracker.
#
# Deploy: in the Render dashboard choose "New +" → "Blueprint", pick this
# repository, and Render creates both services from this file.
#
# Values marked `sync: false` are secrets — Render prompts for them during
# setup and never stores them in this file.

services:
  # ------------------------------------------------------------ backend API
  - type: web
    name: bevigrow-backend
    runtime: python
    # Free instance type. Two consequences to be aware of:
    #   1. No persistent disk is allowed, so UPLOAD_DIR points at the
    #      container filesystem and uploaded files are LOST on every redeploy.
    #      Database records survive (they live in Neon) — only the binaries go.
    #   2. The service sleeps after 15 minutes idle; the next request takes
    #      roughly 50 seconds to wake it.
    # To make uploads durable: change to `plan: starter`, re-add a `disk:`
    # block mounted at /var/data, and set UPLOAD_DIR to /var/data/uploads.
    plan: free
    # Matches the Neon database region (ap-southeast-1) — a backend in Oregon
    # would add roughly 200 ms of round-trip latency to every query.
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon PostgreSQL. Use the POOLED connection string (host contains
      # "-pooler"). A plain postgresql:// URL is fine — the app rewrites it
      # onto the psycopg 3 driver on load.
      - key: DATABASE_URL
        sync: false
      # Google Gemini API key — free tier, no card required. This is the
      # recommended provider; get one at https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      # Anthropic Claude Haiku — paid alternative. Leave both unset and the AI
      # features fall back to built-in rules rather than failing.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Password for the seeded admin account. Only applied when the account
      # is first created — it never overwrites an existing row.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # "auto" prefers Gemini when its key is present, else Anthropic.
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: AI_MODEL
        value: claude-haiku-4-5
      - key: DB_SCHEMA
        value: bevigrow
      - key: SEED_ADMIN_EMAIL
        value: bevigrow@gmail.com
      # Ephemeral on the free plan — see the note on `plan` above.
      - key: UPLOAD_DIR
        value: ./uploads
      # Literal rather than `fromService`: the frontend already resolves its
      # API URL from this service, and pointing the two at each other creates
      # a circular reference that can fail blueprint validation.
      #
      # onrender.com subdomains are global across all Render accounts, so
      # "bevigrow-frontend" was already taken and Render issued
      # "bevigrow-frontend-dkay". Both hosts are listed so the value keeps
      # working if the frontend is ever recreated under the plain name.
      # The app prepends https:// when a scheme is missing.
      - key: CORS_ORIGINS
        value: bevigrow-frontend-dkay.onrender.com,bevigrow-frontend.onrender.com
      # --- authentication -------------------------------------------------
      # Google OAuth client ID. Blank hides the Google button; the app still
      # works with email + password. This is the public client ID, never the
      # client secret.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Open sign-up: anyone who reaches the site can create their own
      # account and sign in immediately. New accounts always land in
      # DEFAULT_SIGNUP_ROLE (employee) — never admin — so they can use the
      # tracker but cannot manage the team or change anyone's role.
      #
      # To limit this to your own company later, set ALLOWED_EMAIL_DOMAINS
      # (e.g. "bevigrow.com") and only those addresses may register.
      - key: ALLOW_SELF_SIGNUP
        value: 'true'
      - key: DEFAULT_SIGNUP_ROLE
        value: employee
      # Password-reset links point at the frontend.
      - key: FRONTEND_URL
        value: https://bevigrow-frontend-dkay.onrender.com
      # SMTP is intentionally NOT declared here. Without it, "Forgot password"
      # reports that no mail can be sent and an admin sets the password from
      # the Team page instead — which needs no configuration at all. To enable
      # reset emails later, add SMTP_HOST / SMTP_USER / SMTP_PASSWORD in the
      # Render dashboard; undeclared variables are not overwritten by a
      # blueprint sync.

      # Belt and braces alongside backend/runtime.txt.
      # --- automated outreach --------------------------------------------
      # Shared secret for POST /api/campaigns/tick, which lets a scheduler
      # advance the sending queue without a login. Set it to a long random
      # string here and to the same value as a GitHub Actions secret named
      # OUTREACH_TICK_TOKEN; the workflow in .github/workflows calls it every
      # ten minutes so campaigns keep sending while nobody is watching.
      # Leave it unset and that endpoint returns 404 — the in-process sender
      # still runs whenever the instance is awake.
      - key: OUTREACH_TICK_TOKEN
        sync: false
      # Minutes ahead of UTC for deciding which day a send counts against.
      # 330 = IST, so "50 today" resets at midnight in India.
      - key: OUTREACH_DAY_OFFSET_MINUTES
        value: '330'
      # Roughly the gap between two emails, in seconds, jittered per send.
      - key: OUTREACH_PACE_SECONDS
        value: '3'

      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: '1'
    # No `disk:` block — Render rejects persistent disks on free instances.

  # -------------------------------------------------------- frontend static
  - type: web
    name: bevigrow-frontend
    runtime: static
    # No `rootDir` here on purpose. Render documents `staticPublishPath` as
    # relative to the REPO ROOT, so combining it with a rootDir is ambiguous:
    # `dist` can resolve to <repo>/dist, which does not exist, and every
    # request then returns "Not Found". Both paths below are repo-root
    # relative, which removes the ambiguity entirely.
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      # A literal URL, deliberately NOT `fromService`.
      #
      # `fromService` resolved to an empty string here, because the static
      # site was built before the backend service existed. Vite inlines this
      # value at BUILD time, so the bundle shipped with no API address and
      # called itself instead. This service is also Blueprint-managed, which
      # means Render re-applies the values from this file on every deploy and
      # overwrites anything set by hand in the dashboard — so the fix has to
      # live here.
      #
      # If the backend's URL differs in your dashboard, change it here and
      # redeploy; editing it in the dashboard alone will not survive.
      - key: VITE_API_URL
        value: https://bevigrow-backend-dkay.onrender.com
      - key: NODE_VERSION
        value: 20.11.0
    routes:
      # Single-page app: serve index.html for any unmatched path so deep links
      # such as /app/contacts/12 survive a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The app shell must never be served stale.
      #
      # Vite fingerprints every asset, so index.html is the one file that says
      # which fingerprints are current. Render's default put it behind a CDN
      # for five minutes (s-maxage=300), which meant a deploy was invisible
      # until that expired — a new feature would go live and the browser would
      # keep loading the previous build's chunks, looking like nothing had
      # shipped. Revalidating it on every load costs one conditional request
      # that answers 304 in a few bytes.
      #
      # Declared before the /assets rule so the immutable one below wins for
      # the files it names.
      - path: /*
        name: Cache-Control
        value: no-cache
      # The fingerprinted files, on the other hand, can be cached forever:
      # their names change whenever their contents do, so a stale one is
      # unreachable rather than wrong.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
