# Render blueprint for the BeviGrow Coffee B2B Tracker.
#
# Deploy: in the Render dashboard choose "New +" → "Blueprint", pick this
# repository, and Render creates both services from this file.
#
# Values marked `sync: false` are secrets — Render prompts for them during
# setup and never stores them in this file.

services:
  # ------------------------------------------------------------ backend API
  - type: web
    name: bevigrow-backend
    runtime: python
    # Free instance type. Two consequences to be aware of:
    #   1. No persistent disk is allowed, so UPLOAD_DIR points at the
    #      container filesystem and uploaded files are LOST on every redeploy.
    #      Database records survive (they live in Neon) — only the binaries go.
    #   2. The service sleeps after 15 minutes idle; the next request takes
    #      roughly 50 seconds to wake it.
    # To make uploads durable: change to `plan: starter`, re-add a `disk:`
    # block mounted at /var/data, and set UPLOAD_DIR to /var/data/uploads.
    plan: free
    # Matches the Neon database region (ap-southeast-1) — a backend in Oregon
    # would add roughly 200 ms of round-trip latency to every query.
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon PostgreSQL. Use the POOLED connection string (host contains
      # "-pooler"). A plain postgresql:// URL is fine — the app rewrites it
      # onto the psycopg 3 driver on load.
      - key: DATABASE_URL
        sync: false
      # Claude Haiku API key. Leave unset and the AI features fall back to
      # built-in rules rather than failing.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Password for the seeded admin account. Only applied when the account
      # is first created — it never overwrites an existing row.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: AI_MODEL
        value: claude-haiku-4-5
      - key: DB_SCHEMA
        value: bevigrow
      - key: SEED_ADMIN_EMAIL
        value: bevigrow@gmail.com
      # Ephemeral on the free plan — see the note on `plan` above.
      - key: UPLOAD_DIR
        value: ./uploads
      # Resolved from the frontend service, so a renamed service does not
      # silently break CORS. Yields a bare host; the app adds the scheme.
      - key: CORS_ORIGINS
        fromService:
          name: bevigrow-frontend
          type: web
          property: host
      # Belt and braces alongside backend/runtime.txt.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: '1'
    # No `disk:` block — Render rejects persistent disks on free instances.

  # -------------------------------------------------------- frontend static
  - type: web
    name: bevigrow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      # Resolved from the backend service rather than hard-coded, so the two
      # cannot drift apart. Vite inlines this at BUILD time, so changing it
      # requires a rebuild, not a restart.
      - key: VITE_API_URL
        fromService:
          name: bevigrow-backend
          type: web
          property: host
      - key: NODE_VERSION
        value: 20.11.0
    routes:
      # Single-page app: serve index.html for any unmatched path so deep links
      # such as /app/contacts/12 survive a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
