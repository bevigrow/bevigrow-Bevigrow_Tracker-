name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BeviGrow backend health check
        run: |
          curl -f https://bevigrow-tracker.onrender.com/api/health || exit 1
        timeout-minutes: 2
